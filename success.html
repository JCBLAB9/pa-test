<script>
    (function () {
        var encryptedFlag = "Mh5VBBBMYxZfRnBzYWgyQgRbUkhmF18SIyNnMzZEAAYJTGRCVwk=";

        function xorDecrypt(base64Value, key) {
            var data = atob(base64Value);
            var output = [];
            for (var i = 0; i < data.length; i++) {
                output.push(
                    String.fromCharCode(
                        data.charCodeAt(i) ^ key.charCodeAt(i % key.length)
                    )
                );
            }
            return output.join("");
        }

        var params = new URLSearchParams(window.location.search);
        var key = params.get("k") || "";
        var flagTarget = document.getElementById("flag");

        if (!key) {
            flagTarget.textContent = "[clave requerida]";
            return;
        }

        var decrypted = xorDecrypt(encryptedFlag, key);
        if (decrypted.indexOf("flag{") === 0) {
            flagTarget.textContent = decrypted;
        } else {
            flagTarget.textContent = "[clave incorrecta]";
        }
    })();
</script>
