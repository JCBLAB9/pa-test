<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProtAAP [Sec Mode RootedCON] - Acceso remoto</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    img { max-width: 358px; margin-bottom: 20px; }
    h3 { color: #000000; margin-bottom: 20px; }
    #secret { white-space: pre-wrap; }
  </style>
</head>

<body>
  <img src="Logo_PROTAAPP.jpg" alt="ProtAAPP logo">
  <h3>RETO CONSEGUIDO</h3>

  <div id="secret"></div>

  <script>
    const CT_B64 = "GNy7GTss+K2c/KhiyIzDl8Gda4eyEgE+96Sn0Hn3lMenHLHrpR/KsH0Wyh6yWpmAlyZe7iV5xYmX/eAiqe6JNGDfssqegSa15p5+8XwtSEkMMKl7mh24Fvdvpv9agCuuoE2XMd/f1CUTnDyEYnYhzmzV6lKlG8JHH0SCxWMH0IrxFezyB4WI9GDIV8u6+2fR3fJ6Gf3QnWTLtYVAGCoC33DWNbRsFk3c82TX8JzRUKDBaLz1K1XiwXHA9HUziXY=";

    const el = document.getElementById("secret");
    const k = new URLSearchParams(location.search).get("k") || "";

    const b64ToU8 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const u8ToTxt = u8 => new TextDecoder().decode(u8);

    async function keyFromK(k){
      const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(k));
      return crypto.subtle.importKey("raw", hash, "AES-GCM", false, ["decrypt"]);
    }

    async function tryDecrypt(k, ctB64){
      const data = b64ToU8(ctB64);
      const iv = data.slice(0, 12);
      const ct = data.slice(12);
      const key = await keyFromK(k);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      return u8ToTxt(new Uint8Array(pt));
    }

    (async () => {
      if (!k) { el.textContent = CT_B64; return; }
      try {
        el.innerHTML = await tryDecrypt(k, CT_B64);
      } catch {
        el.textContent = CT_B64;
      }
    })();
  </script>
</body>
</html>
